[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmd-policy"
version = "0.1.0"
description = "Transition-matching and occupancy-prioritized distillation prototype for LIBERO VLAs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "torch>=2.5",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
tmd-policy = "tmd_policy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

