[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmd-policy"
version = "0.2.0"
description = "Executable PI0.5-to-SmolVLA flow distillation on LIBERO"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.10,<4",
  "numpy>=2.2,<2.3",
  "pyyaml>=6.0,<7",
  "torch==2.11.0",
  "tqdm>=4.67,<5",
  "lerobot[training,pi,smolvla,libero,evaluation]==0.6.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
tmd-policy = "tmd_policy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires cached real Hub assets and usually an NVIDIA GPU",
]

[tool.ruff]
line-length = 110
target-version = "py312"
